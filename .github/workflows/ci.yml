name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check colour contrast
        # Parses src/styles/tokens.css and recomputes every ink/surface pairing
        # in both themes against WCAG AA. Cheap and build-independent, so it
        # runs early — a palette regression fails here rather than in the much
        # slower e2e a11y suite.
        run: npm run contrast

      - name: Test
        run: npm run test

      # `npm run test` above runs BOTH vitest projects and reports one total.
      # If the headless-Chromium project ever produced zero tests instead of
      # failing, that total would just look short and a human would have to
      # notice — and 12 of this repo's suites live only in that project
      # (anything touching OffscreenCanvas, real DOM, or real key events).
      # A floor on its own count turns "silently ran nothing" into a red build.
      # Raise MIN when the browser suite grows; it is a floor, not an equality.
      - name: Assert the browser test project actually ran
        shell: bash
        run: |
          MIN=150
          out=$(npx vitest run --project browser --reporter=basic 2>&1) || { echo "$out"; exit 1; }
          count=$(printf '%s' "$out" | grep -oE '[0-9]+ passed' | tail -1 | grep -oE '[0-9]+')
          echo "browser project reported ${count:-0} passing tests (floor $MIN)"
          if [ -z "$count" ] || [ "$count" -lt "$MIN" ]; then
            echo "::error::browser vitest project reported ${count:-0} tests, expected >= $MIN"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check size budget
        run: npm run size

      - name: E2E tests
        # playwright.config.ts's webServer rebuilds and serves dist/ itself,
        # so this doesn't depend on the Build step above — it's kept last
        # because it's the slowest gate. Chromium is already installed by
        # the "Install Playwright Chromium" step above (browser vitest
        # project and Playwright's own test runner share that install).
        run: npm run test:e2e
