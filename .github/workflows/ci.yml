name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Vendor OCR assets
        # Copies the OCR worker/core/language files into public/ocr/ (see
        # scripts/vendor-ocr.mjs). Also runs automatically via the "pretest"
        # and "prebuild" npm hooks below, but an explicit step here keeps it
        # visible in the log and out of the "Test"/"Build" step's own timing.
        run: npm run vendor:ocr

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check size budget
        run: npm run size

      - name: E2E tests
        # playwright.config.ts's webServer rebuilds and serves dist/ itself,
        # so this doesn't depend on the Build step above — it's kept last
        # because it's the slowest gate. Chromium is already installed by
        # the "Install Playwright Chromium" step above (browser vitest
        # project and Playwright's own test runner share that install).
        run: npm run test:e2e
