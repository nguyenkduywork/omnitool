name: Deploy

# Build and publish dist/ to GitHub Pages. vite.config.ts already sets
# base: './' for relative, host-agnostic asset paths, so no path rewriting is
# needed here — Pages just serves dist/ as-is.
#
# WHY workflow_run AND NOT A BARE `push`: this workflow builds and checks the
# size budget, but it does NOT run typecheck, lint, or any test — CI does.
# Triggering on push would race CI and could publish a commit CI is about to
# fail. Waiting for CI to complete successfully on main means a red commit
# never reaches the live site. workflow_dispatch stays for a re-deploy
# without a new commit.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel an in-flight one rather than queueing
# behind it, since only the latest main matters for a live site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A workflow_run fires on CI FAILURE too, so the conclusion has to be
    # checked explicitly; a manual run has no workflow_run to inspect.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run defaults to the default branch's tip, which can already
      # have moved past the commit CI green-lit. Pin to the exact SHA CI ran.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check size budget
        run: npm run size

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
