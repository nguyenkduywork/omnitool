name: Deploy

# Build and publish dist/ to GitHub Pages, triggered manually from the
# Actions tab. vite.config.ts already sets base: './' for relative,
# host-agnostic asset paths, so no path rewriting is needed here — Pages
# just serves dist/ as-is.
#
# Manual rather than on-push: GitHub Pages isn't available for a private
# repo below GitHub Pro/Team/Enterprise, so triggering on every push to main
# just fails every time. Run this by hand (Actions -> Deploy -> Run
# workflow) once Pages is actually reachable — repo made public, or the
# account's plan supports private Pages.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel an in-flight one rather than queueing
# behind it, since only the latest main matters for a live site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check size budget
        run: npm run size

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
